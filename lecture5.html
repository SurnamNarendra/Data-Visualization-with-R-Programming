  <style>

<body>
   <img src="images/wos ppt.png" alt="University Logo" class="top-right-logo">

<div class="wrap">
  <header>
    <div>
      <h1>Lecture 5 — Students Enter Data (3 Populations × 10 Values)</h1>
    </div>
  </header>

  <section class="grid" id="apps"></section>

  <div class="center">
    <button id="computeAll">Compute All</button>
    <button id="clearAll" class="mutedbtn">Clear All</button>
  </div>

 
</div>

<script>
const applications = [
  'Glucose levels (mg/dL) — 3 populations',
  'Temperature (°C) — 3 regions',
  'Cricket scores — 3 teams',
  'Systolic BP (mm Hg) — 3 patient groups',
  'Daily steps — 3 age groups',
  'Exam marks — 3 classes',
  'Reaction time (ms) — 3 labs',
  'Yield (kg) — 3 plots',
  'Website visits — 3 time periods',
  'Product ratings — 3 customer groups'
];

const appsContainer = document.getElementById('apps');

applications.forEach((title)=>{
  const card = document.createElement('section'); 
  card.className='card';

  let populationsHTML = "";
  for(let p=1;p<=3;p++){
    populationsHTML += `
      <div class="population-block" data-pop="${p}">
        <div class="pop-title">Population ${p}</div>
        <div class="row inputs">
          ${Array.from({length:10}).map((_,i)=>`
            <input type="number" step="any" placeholder="v${i+1}">
          `).join('')}
        </div>
        <div style="margin-top:6px;display:flex;gap:6px">
          <button class="computeBtn">Compute</button>
          <button class="clearBtn mutedbtn">Clear</button>
        </div>
        <div class="resultsArea small"></div>
      </div>
    `;
  }

  card.innerHTML = `<label>${title}</label>${populationsHTML}`;
  appsContainer.appendChild(card);

  card.querySelectorAll('.computeBtn').forEach(btn => {
    btn.addEventListener('click', e => {
      computePopulation(e.target.closest('.population-block'));
    });
  });

  card.querySelectorAll('.clearBtn').forEach(btn => {
    btn.addEventListener('click', e => {
      clearPopulation(e.target.closest('.population-block'));
    });
  });
});


function cleanedValues(block){
  const inputs = Array.from(block.querySelectorAll('input'));
  return inputs.map(i=> i.value.trim()===''?null:Number(i.value))
               .filter(v=>v!==null && !isNaN(v));
}
function mean(a){ return a.reduce((x,y)=>x+y,0)/a.length; }
function variance(a){ const m=mean(a); return a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1); }
function sd(a){ return Math.sqrt(variance(a)); }
function quantile(a,q){
  const s=[...a].sort((x,y)=>x-y); const pos=(s.length-1)*q;
  const lo=Math.floor(pos), hi=Math.ceil(pos);
  if(lo===hi) return s[lo];
  return s[lo]*(1-(pos-lo)) + s[hi]*(pos-lo);
}
function detectOutliers(a){
  const Q1=quantile(a,0.25), Q3=quantile(a,0.75);
  const IQR=Q3-Q1;
  const lf=Q1-1.5*IQR, hf=Q3+1.5*IQR;

  const m=mean(a), s=sd(a);
  const zs = a.map(x => (x-m)/s);

  return {
    outIQR: a.map(x=> x<lf || x>hf),
    outZ: zs.map(z=> Math.abs(z)>2.5),
    Q1,Q3,IQR,zs
  };
}
function format(x){ return isNaN(x)?'-':Math.round(x*100)/100; }

function computePopulation(block){
  const inputs = Array.from(block.querySelectorAll('input'));
  const vals = cleanedValues(block);
  const res = block.querySelector('.resultsArea');
  res.innerHTML = '';

  inputs.forEach(i=> i.classList.remove('outlier'));

  if(vals.length===0){
    res.innerHTML = "<div>No valid values.</div>";
    return;
  }

  const m=mean(vals), s=sd(vals), cv=s/m*100;
  const {outIQR,outZ,Q1,Q3,IQR,zs} = detectOutliers(vals);

  res.innerHTML += `
    <div class="results">
      <div class="pill">N: ${vals.length}</div>
      <div class="pill">Mean: ${format(m)}</div>
      <div class="pill">SD: ${format(s)}</div>
      <div class="pill">CV%: ${format(cv)}</div>
    </div>
    <div>IQR = ${format(IQR)}, Q1 = ${format(Q1)}, Q3 = ${format(Q3)}</div>
  `;

  // mark outliers
  let idx=0;
  inputs.forEach(inp=>{
    if(inp.value.trim()==='') return;
    if(outIQR[idx] || outZ[idx]){
      inp.classList.add('outlier');
    }
    inp.title = `zs=${format(zs[idx])} outIQR=${outIQR[idx]} outZ=${outZ[idx]}`;
    idx++;
  });

  const finalOut = vals.map((v,i)=> (outIQR[i]||outZ[i])?v:null).filter(v=>v!==null);
  res.innerHTML += `<div><strong>Outliers:</strong> ${finalOut.length?finalOut.join(', '):'None'}</div>`;
}

function clearPopulation(block){
  block.querySelectorAll('input').forEach(i=>{
    i.value=''; i.classList.remove('outlier'); i.title='';
  });
  block.querySelector('.resultsArea').innerHTML='';
}

document.getElementById('computeAll').addEventListener('click', ()=>{
  document.querySelectorAll('.population-block').forEach(p=> computePopulation(p));
});
document.getElementById('clearAll').addEventListener('click', ()=>{
  document.querySelectorAll('.population-block').forEach(p=> clearPopulation(p));
});
</script>

  <script>
    async function includeHTML(id, file) {
      const el = document.getElementById(id);
      const resp = await fetch(file);
      if (resp.ok) el.innerHTML = await resp.text();
    }
    includeHTML("navbar-placeholder", "navbar.html");
    includeHTML("footer-placeholder", "footer.html");

    const btn = document.getElementById("backToTop");
    window.onscroll = () => btn.style.display = document.documentElement.scrollTop > 200 ? "block" : "none";
    btn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
  </script>
