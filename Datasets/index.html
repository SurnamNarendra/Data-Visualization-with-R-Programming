<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dataset Files</title>

<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #f6f8fa;
        padding: 20px 40px;
    }
    h2 {
        color: #24292f;
        font-weight: 600;
    }
    .file-list {
        margin-top: 20px;
        background: #fff;
        padding: 20px;
        border-radius: 6px;
        border: 1px solid #d0d7de;
    }
    .file-item {
        display: flex;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid #eaecef;
    }
    .file-item:last-child {
        border-bottom: none;
    }
    .file-icon {
        width: 20px;
        height: 20px;
        margin-right: 12px;
        opacity: 0.7;
    }
    a {
        font-size: 16px;
        color: #0969da;
        text-decoration: none;
    }
    a:hover {
        text-decoration: underline;
    }
</style>

</head>
<body>

<h2>Dataset Files</h2>

<div class="file-list">

<!-- Automatically generated file list -->
<!-- Data_1.csv to Data_30.csv -->

<script>
    // Put the *actual* existing file names here:
    const files = [
        "Data_1.csv",
        "Data_2.csv",
        "Data_4.csv",
        "Data_5.csv",
        "Data_6.csv",
        "Data_7.csv",
        "Data_8.csv",
        "Data_9.csv",
        "Data_10.csv",
        "Data_12.csv",
        "Data_13.csv",
        "Data_14.csv",
        "Data_15.csv",
        "Data_16.csv",
        "Data_17.csv",
        "Data_18.csv",
        "Data_19.csv",
        "Data_20.csv",
        "Data_21.csv",
        "Data_22.csv",
        "Data_24.csv",
        "Data_25.csv",
        "Data_26.csv",
        "Data_27.csv",
                "Data_30.csv",
                "Data_31.csv", // instead of 3
                "Data_32.csv", // instead of 11
        "Data_39.csv", // instead of 23
        "Data_42.csv",
        "Data_43.csv",
    ];

    files.forEach(file => {
        document.write(`
            <div class="file-item">
                <img class="file-icon" src="https://cdn-icons-png.flaticon.com/512/337/337946.png">
                <a href="${file}" download>${file}</a>
            </div>
        `);
    });
</script>


</div>

</body>
</html>
